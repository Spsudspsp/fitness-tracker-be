services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - default

  backend:
    build:
      context: .

    command: python manage.py runserver 0.0.0.0:8000

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432

    volumes:
      - .:/app

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - default
      - fitness-tracker-network

    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - default

  celery:
    build:
      context: .

    command: celery -A fitness-tracker-be worker --loglevel=info

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - default

volumes:
  postgres_data:

networks:
  fitness-tracker-network:
    external: true